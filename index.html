      font-weight: 600;
      display: flex;

      padding: 4px 10px;
      border-radius: 9999px;
    }

    .main-container {

      flex: 1;

      gap: 10px;

      border-radius: 6px;
      font-size: 0.9rem;
      outline: none;
      transition: border-color 0.2s;

      box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.2);

    .filters-row {
      display: flex;
      gap: 8px;
    }

      padding: 8px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      background: #fff;

      color: var(--muted);
      background: #f1f5f9;
      display: flex;
      justify-content: space-between;
    }

    .facility-list {
      flex: 1;
      overflow-y: auto;
      padding: 8px 12px;
    }

    .card {
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 8px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .card:hover {
      border-color: var(--primary-light);
      transform: translateY(-1px);
      box-shadow: 0 3px 6px rgba(0,0,0,0.06);
    }

    .card.active {
      border-color: var(--primary);
      background: #eff6ff;
    }

    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 6px;
    }

    .card-title {
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--primary);
      line-height: 1.3;
    }

    .tag {
      font-size: 0.72rem;
      padding: 2px 6px;
      border-radius: 4px;
      font-weight: 500;
      white-space: nowrap;
    }

    .tag-kindergarten { background: #fee2e2; color: #991b1b; }
    .tag-afterschool { background: #fef3c7; color: #92400e; }
    .tag-infant { background: #e0f2fe; color: #075985; }

    .card-meta {
      font-size: 0.82rem;
      color: #4b5563;
      margin-bottom: 4px;
    }

    .card-benefit {
      font-size: 0.8rem;
      color: #047857;
      background: #ecfdf5;
      padding: 4px 6px;
      border-radius: 4px;
      margin-top: 6px;
      white-space: pre-line;
      line-height: 1.35;
    }

    #map {
      flex: 1;
      height: 100%;
      background: #e2e8f0;
    }

      border-radius: 8px;
      box-shadow: 0 4px 14px rgba(0,0,0,0.15);

      font-size: 0.85rem;
      line-height: 1.5;
    }

      font-size: 1rem;
      font-weight: 700;
      color: var(--primary);
      border-bottom: 1px solid #e5e7eb;
      padding-bottom: 4px;
      margin-bottom: 6px;
    }

    .popup-field {
      margin-bottom: 4px;
    }

    .popup-field strong {
      color: #374151;
    }

    .popup-benefit {

      padding: 6px;
      margin-top: 6px;
      color: #166534;

      {"id":111,"name":"桃園市私立格林大華托嬰中心","type":"托嬰中心","address":"龜山區自強南路340號1樓","area":"龜山","head":"趙良英","contact":"趙○英","phone":"03-3298288","fax":"03-3507119","benefit":"贈送精美圍兜。","period":"113年7月8日至115年7月7日止"}
    ];

    // 行政區基準座標（用於地圖定址錨定）
    const DISTRICT_CENTERS = {
      '桃園': [24.9936, 121.3010],
      '中壢': [24.9654, 121.2248],
      '八德': [24.9287, 121.2846],
      '平鎮': [24.9450, 121.2185],
      '楊梅': [24.9080, 121.1458],
      '蘆竹': [25.0456, 121.2917],
      '大園': [25.0645, 121.1963],
      '龜山': [24.9961, 121.3644],
      '龍潭': [24.8637, 121.2163],
      '大溪': [24.8837, 121.2882],
      '觀音': [25.0368, 121.0827],
      '新屋': [24.9722, 121.1062]
    };

    // 確定性座標偏移演算法（基於地址字串雜湊，確保同一機構重整後位置固定，且不會全部死疊在同一點）
    function computeCoords(area, address) {
      const cleanArea = area.replace('區', '').trim();
      const base = DISTRICT_CENTERS[cleanArea] || [24.9936, 121.3010];
      let hash = 0;
      for (let i = 0; i < address.length; i++) {
        hash = (hash << 5) - hash + address.charCodeAt(i);
        hash |= 0;
      }
      const latOffset = ((Math.abs(hash) % 1000) - 500) / 75000.0;
      const lngOffset = (((Math.abs(hash >> 5)) % 1000) - 500) / 75000.0;
      return [Number((base[0] + latOffset).toFixed(6)), Number((base[1] + lngOffset).toFixed(6))];
    }

    // 初始化資料與座標
    const facilities = RAW_DATA.map(item => {
      const coords = computeCoords(item.area, item.address);
      return {
        ...item,
        lat: coords[0],
        lng: coords[1]
      };
    });

    // 初始化地圖
    const map = L.map('map', {
      center: [24.985, 121.24],
      zoom: 12,
      zoomControl: true
    });

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> 貢獻者',
      maxZoom: 19
    }).addTo(map);

    // 建立聚合圖層群組
    const clusterGroup = L.markerClusterGroup({
      spiderfyOnMaxZoom: true,
      showCoverageOnHover: false,
      zoomToBoundsOnClick: true,
      maxClusterRadius: 40
    });
    map.addLayer(clusterGroup);

    // 關聯 Marker 與 DOM
    const markerMap = new Map();

    function getTypeTagClass(type) {
      if (type.includes('幼兒園')) return 'tag-kindergarten';
      if (type.includes('課後')) return 'tag-afterschool';
      if (type.includes('托嬰')) return 'tag-infant';
      return '';
    }

    function buildPopupHtml(f) {
      const gmapsUrl = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(f.address)}`;
      return `
        <div class="popup-box">
          <div class="popup-title">${f.name}</div>
          <div class="popup-field"><strong>種類：</strong>${f.type}（${f.area}區）</div>
          <div class="popup-field"><strong>地址：</strong>${f.address}</div>
          <div class="popup-field"><strong>電話：</strong><a href="tel:${f.phone}">${f.phone}</a> ${f.fax !== '-' ? `| 傳真：${f.fax}` : ''}</div>
          <div class="popup-field"><strong>負責人/聯絡人：</strong>${f.head} / ${f.contact}</div>
          <div class="popup-field"><strong>特約期間：</strong>${f.period}</div>
          <div class="popup-benefit"><strong>特約優惠措施：</strong><br>${f.benefit}</div>
          <a class="btn-nav" href="${gmapsUrl}" target="_blank" rel="noopener noreferrer">開啟 Google 導航 ↗</a>
        </div>
      `;
    }

    // 渲染清單與標記
    function render(data) {
      clusterGroup.clearLayers();
      markerMap.clear();

      const listContainer = document.getElementById('facilityList');
      listContainer.innerHTML = '';

      document.getElementById('filteredCount').innerText = `共 ${data.length} 家`;
      document.getElementById('statsCount').innerText = `目前顯示: ${data.length} / 111 家`;

      if (data.length === 0) {
        listContainer.innerHTML = '<div style="padding: 20px; text-align: center; color: #9ca3af;">無符合條件的特約機構</div>';
        return;
      }

      data.forEach(item => {
        // 1. 建立地圖 Marker
        const marker = L.marker([item.lat, item.lng]);
        marker.bindPopup(buildPopupHtml(item), { maxWidth: 320 });
        clusterGroup.addLayer(marker);
        markerMap.set(item.id, marker);

        // 2. 建立側邊欄 Card
        const card = document.createElement('div');
        card.className = 'card';
        card.id = `card-${item.id}`;
        card.innerHTML = `
          <div class="card-top">
            <span class="card-title">${item.id}. ${item.name}</span>
            <span class="tag ${getTypeTagClass(item.type)}">${item.type}</span>
          </div>
          <div class="card-meta">📍 ${item.address}</div>
          <div class="card-meta">📞 ${item.phone} ｜ 聯絡人：${item.contact}</div>
          <div class="card-benefit">🎁 優惠：${item.benefit.replace(/\n/g, ' ')}</div>
        `;

        // 點擊卡片定位地圖
        card.addEventListener('click', () => {
          document.querySelectorAll('.card').forEach(c => c.classList.remove('active'));
          card.classList.add('active');

          clusterGroup.zoomToShowLayer(marker, () => {
            map.flyTo([item.lat, item.lng], 16, { duration: 0.8 });
            marker.openPopup();
          });
        });

        listContainer.appendChild(card);
      });
    }

    // 建立下拉選單選項
    function populateDropdowns() {
      const areaSelect = document.getElementById('areaFilter');
      const typeSelect = document.getElementById('typeFilter');

      const areas = Array.from(new Set(facilities.map(f => f.area))).filter(Boolean);
      areas.forEach(a => {
        const opt = document.createElement('option');
        opt.value = a;
        opt.innerText = `${a}區`;
        areaSelect.appendChild(opt);
      });

      const types = Array.from(new Set(facilities.map(f => f.type))).filter(Boolean);
      types.forEach(t => {
        const opt = document.createElement('option');
        opt.value = t;
        opt.innerText = t;
        typeSelect.appendChild(opt);
      });
    }

    // 篩選核心邏輯
    function applyFilters() {
      const keyword = document.getElementById('searchInput').value.trim().toLowerCase();
      const selectedArea = document.getElementById('areaFilter').value;
      const selectedType = document.getElementById('typeFilter').value;

      const filtered = facilities.filter(item => {
        const matchKeyword = !keyword ||
          item.name.toLowerCase().includes(keyword) ||
          item.address.toLowerCase().includes(keyword) ||
          item.phone.includes(keyword) ||
          item.benefit.toLowerCase().includes(keyword);

        const matchArea = !selectedArea || item.area === selectedArea;
        const matchType = !selectedType || item.type === selectedType;

        return matchKeyword && matchArea && matchType;
      });

      render(filtered);
    }

    // 事件監聽
    document.getElementById('searchInput').addEventListener('input', applyFilters);
    document.getElementById('areaFilter').addEventListener('change', applyFilters);
    document.getElementById('typeFilter').addEventListener('change', applyFilters);

    // 啟動程式
    populateDropdowns();
    render(facilities);
  </script>
